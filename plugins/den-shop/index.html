<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Den Shop</title>
  <style>
    :root {
      --bg: #0b0b0c; --panel: #111113; --panel2: #151518; --line: #1f1f22; --line2: #2f2f34; --line3: #45454b;
      --text: #ededee; --dim: #a6a6ac; --faint: #6c6c72; --good: #4ade80; --warn: #fbbf24; --bad: #f87171;
      --mono: ui-monospace, "JetBrains Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    h1 { font-size: 16px; font-weight: 650; margin: 0; }
    .sub { color: var(--faint); font-size: 12px; margin-top: 3px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .sp { flex: 1; }
    input, select { background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 9px; font: inherit; height: 32px; padding: 0 10px; outline: none; }
    input:focus { border-color: #5a5a60; }
    #search { flex: 1; min-width: 140px; }
    #slot { width: 64px; }
    button { height: 32px; padding: 0 14px; border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer; background: transparent; color: var(--text); border: 1px solid var(--line2); white-space: nowrap; }
    button.primary { background: #f4f4f5; color: #0b0b0c; border: 0; }
    button:disabled { opacity: .4; cursor: default; }
    .tabs { display: flex; gap: 4px; }
    .tabs button { height: 28px; padding: 0 12px; font-size: 12px; border-color: transparent; color: var(--faint); }
    .tabs button.on { border-color: var(--line2); color: var(--text); background: var(--panel); }
    .list { flex: 1; min-height: 120px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
    .den { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); cursor: pointer; }
    .den:first-child { border-top: 0; }
    .den:hover { background: var(--panel); }
    .den.on { background: var(--panel2); box-shadow: inset 2px 0 0 var(--text); }
    .den .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .den .tag.bad { color: var(--bad); border-color: #5b2a2f; }
    .den .tag { font-size: 10px; letter-spacing: .8px; color: var(--faint); border: 1px solid var(--line2); border-radius: 999px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
    .den .c { font-family: var(--mono); font-size: 12px; color: var(--dim); }
    .empty { color: var(--faint); padding: 18px; text-align: center; font-size: 12.5px; }
    .note { color: var(--faint); font-size: 11.5px; }
    #status { font-size: 12px; color: var(--faint); min-height: 18px; }
    #status.error { color: var(--bad); }
    #status.ok { color: var(--good); }
  </style>
</head>
<body>
  <div>
    <h1>Den Shop</h1>
    <div class="sub">Buy any den, even ones the game's shop isn't showing. The game still checks your Gems, Diamonds and membership.</div>
  </div>
  <div class="row">
    <div class="tabs" id="tabs"><button data-tab="gems" class="on">Gems</button><button data-tab="diamonds">Diamonds</button></div>
    <input id="search" placeholder="Search dens" spellcheck="false">
  </div>
  <div class="list" id="list"><div class="empty">Loading the den list…</div></div>
  <label class="note" id="showAllRow"><input id="showAll" type="checkbox"> Also show dens the game doesn't sell for Gems right now (buying these usually fails)</label>
  <div class="row">
    <label class="note">Den slot <input id="slot" type="number" min="1" max="99" value="1"></label>
    <span class="note">Must be an empty slot. Slot 1 is usually your first den, so try the number after your last den.</span>
    <span class="sp"></span>
    <button id="buy" class="primary" disabled>Buy</button>
  </div>
  <div id="status"></div>
  <script>
    (async () => {
      const $ = (id) => document.getElementById(id)
      const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }
      const setStatus = (text, kind) => { $('status').textContent = text || ''; $('status').className = kind || '' }
      const jam = window.jam || await new Promise(resolve => {
        const t = setInterval(() => { if (window.jam) { clearInterval(t); resolve(window.jam) } }, 25)
      })
      const path = require('path')
      const D = require(path.join(__dirname, 'dens.js'))
      const { dispatch, storage } = jam
      const items = jam.application && jam.application.items

      let tab = 'gems'
      let query = ''
      let dens = new Map()
      let diamondDens = new Map()
      let forSale = null // diamond shop ids for sale now
      let selected = null // { id, diamonds, name, cost }
      let confirming = false
      let buying = null // the den being bought, with its slot
      let refused = storage.get('refused', {}) // "g:12" -> times the game said no
      const refuseKey = (r) => `${r.diamonds ? 'd' : 'g'}:${r.id}`
      $('showAll').checked = storage.get('showAll', false)
      $('showAll').onchange = () => { storage.set('showAll', $('showAll').checked); render() }

      $('slot').value = storage.get('slot', 1)
      $('slot').onchange = () => storage.set('slot', Number($('slot').value) || 1)

      /* ---------------------------------------------------- data */
      async function load () {
        const version = items && items.deployVersion
        if (!version || typeof items.fetchPack !== 'function') {
          $('list').innerHTML = '<div class="empty">Log in to Animal Jam first, so JR can read the game’s den list.</div>'
          return false
        }
        const cached = storage.get('cache2', null)
        if (cached && cached.version === version && Array.isArray(cached.dens)) {
          dens = new Map(cached.dens.map(d => [d.id, d]))
          diamondDens = new Map((cached.diamond || []).map(d => [d.shopId, d]))
          return true
        }
        setStatus('Reading the den list from the game…')
        const [denPack, shopPack, strings] = await Promise.all([
          items.fetchPack(version, D.PACKS.dens),
          items.fetchPack(version, D.PACKS.diamondShop).catch(() => null),
          items.fetchPack(version, D.PACKS.strings)
        ])
        dens = D.readDens(denPack, strings)
        diamondDens = shopPack ? D.readDiamondDens(shopPack, dens) : new Map()
        storage.set('cache2', { version, dens: [...dens.values()], diamond: [...diamondDens.values()] })
        // Field names of the game's den data, to check JR reads it right.
        const sample = D.entriesOf(denPack).slice(0, 2).map(e => JSON.stringify(e)).join(' ')
        jam.application.consoleMessage({ type: 'notify', message: `Den Shop: read ${dens.size} dens (${[...dens.values()].filter(d => d.forGems).length} sold for Gems), ${diamondDens.size} Diamond Shop dens. Den data fields: ${D.describe(denPack)}. Sample: ${sample.slice(0, 600)}` })
        if (!diamondDens.size && shopPack) jam.application.consoleMessage({ type: 'warn', message: `Den Shop: couldn't find dens in the Diamond Shop data (fields: ${D.describe(shopPack)}).` })
        setStatus('')
        return true
      }

      /* ---------------------------------------------------- list */
      function rows () {
        const q = query.toLowerCase()
        if (tab === 'gems') {
          const all = $('showAll').checked
          return [...dens.values()].filter(d => d.gems > 0 && (all || d.forGems))
            .map(d => ({ id: d.id, diamonds: false, name: d.name, cost: d.gems, members: d.members, forGems: d.forGems }))
        }
        const ids = forSale || [...diamondDens.keys()]
        return ids.map(id => {
          const e = diamondDens.get(id)
          const d = e && dens.get(e.denId)
          return { id, diamonds: true, name: d ? d.name : `Diamond Shop item #${id}`, cost: e ? e.diamonds : 0, members: d ? d.members : false, known: !!e }
        }).filter(r => r.known || forSale)
          .filter(r => !q || r.name.toLowerCase().includes(q))
      }
      function render () {
        const list = $('list')
        list.textContent = ''
        const shown = rows().filter(r => !query || r.name.toLowerCase().includes(query.toLowerCase()))
          .sort((a, b) => a.name.localeCompare(b.name) || a.cost - b.cost)
        if (!shown.length) {
          list.appendChild(el('div', 'empty', tab === 'diamonds' && !diamondDens.size && !forSale ? 'Diamond dens show up once the game sends the Diamond Shop list.' : query ? `No dens match “${query}”.` : 'No dens here.'))
        }
        for (const r of shown) {
          const row = el('div', 'den' + (selected && selected.id === r.id && selected.diamonds === r.diamonds ? ' on' : ''))
          const name = el('div', 'n', r.name)
          if (r.members) name.appendChild(el('span', 'tag', 'MEMBERS'))
          if (r.forGems === false) name.appendChild(el('span', 'tag bad', 'NOT SOLD'))
          if (refused[refuseKey(r)]) { const t = el('span', 'tag bad', 'FAILED BEFORE'); t.title = `The game said no ${refused[refuseKey(r)]} time(s) when you tried to buy this.`; name.appendChild(t) }
          row.append(name, el('span', 'c', r.cost ? `${r.cost.toLocaleString()} ${r.diamonds ? 'Diamonds' : 'Gems'}` : '—'))
          row.onclick = () => { selected = r; confirming = false; render() }
          list.appendChild(row)
        }
        $('showAllRow').style.display = tab === 'gems' ? '' : 'none'
        $('buy').disabled = !selected || !!buying
        $('buy').textContent = !selected ? 'Buy' : confirming ? `Press again to buy for ${selected.cost ? selected.cost.toLocaleString() + (selected.diamonds ? ' Diamonds' : ' Gems') : 'its price'}` : `Buy ${selected.name}`
      }

      document.querySelectorAll('#tabs button').forEach(b => {
        b.onclick = () => {
          tab = b.dataset.tab
          document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b))
          selected = null; confirming = false
          if (tab === 'diamonds') askDiamondList()
          render()
        }
      })
      $('search').oninput = () => { query = $('search').value.trim(); render() }

      /* ---------------------------------------------------- game */
      function askDiamondList () {
        const room = dispatch.getState('room')
        if (room) dispatch.sendRemoteMessage(D.listRequest(room)).catch(() => {})
      }
      dispatch.onMessage({
        type: 'aj',
        message: 'gl',
        callback: ({ message }) => {
          const ids = D.readDiamondList(message.value)
          if (!ids) return
          forSale = ids
          if (tab === 'diamonds') render()
        }
      })
      dispatch.onMessage({
        type: 'aj',
        message: 'db',
        callback: ({ message }) => {
          const r = D.readBuyReply(message.value)
          if (!r || !buying) return
          const tried = buying
          buying = null
          const key = refuseKey(tried)
          if (r.ok) {
            delete refused[key]
            setStatus(`Bought ${tried.name}! You have ${Number(r.balance).toLocaleString()} ${tried.diamonds ? 'Diamonds' : 'Gems'} left.`, 'ok')
          } else {
            refused[key] = (refused[key] || 0) + 1
            const hints = D.refusalHints(tried)
            setStatus(`The game said no to ${tried.name} in slot ${tried.slot}. Usually because ${hints.slice(0, -1).join(', ')}${hints.length > 1 ? ', or ' : ''}${hints[hints.length - 1]}.`, 'error')
            jam.application.consoleMessage({ type: 'warn', message: `Den Shop: refused ${tried.diamonds ? 'Diamond' : 'Gem'} den "${tried.name}" (id ${tried.id}, slot ${tried.slot}). Game answered: ${message.raw || (Array.isArray(message.value) ? message.value.join('%') : '')}` })
          }
          storage.set('refused', refused)
          render()
        }
      })

      $('buy').onclick = async () => {
        if (!selected || buying) return
        if (!confirming) { confirming = true; return render() }
        confirming = false
        try {
          const packet = D.buyPacket({ room: dispatch.getState('room'), id: selected.id, slot: $('slot').value, diamonds: selected.diamonds })
          buying = { ...selected, slot: Number($('slot').value) }
          render()
          setStatus(`Buying ${selected.name}…`)
          await dispatch.sendRemoteMessage(packet)
          setTimeout(() => { if (buying) { buying = null; setStatus('No answer from the game. Check your dens in Animal Jam.', 'error'); render() } }, 8000)
        } catch (error) {
          buying = null
          setStatus(error.message, 'error')
          render()
        }
      }

      /* ---------------------------------------------------- start */
      async function start () {
        try {
          if (!(await load())) { setTimeout(start, 2000); return }
          render()
          askDiamondList()
        } catch (error) {
          setStatus(error.message, 'error')
          $('list').innerHTML = '<div class="empty">The den list couldn’t be read. Report a bug with this message in the JR Discord.</div>'
        }
      }
      start()
    })().catch((error) => {
      const status = document.getElementById('status')
      status.textContent = "Den Shop couldn't start: " + error.message
      status.className = 'error'
    })
  </script>
</body>
</html>
