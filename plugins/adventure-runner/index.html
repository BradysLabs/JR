<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="app://assets/styles/style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <title>Adventures</title>
  <style>
    .ar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      min-height: 0;
      font-size: .8rem;
    }

    .ar-section-title {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      opacity: .6;
      margin-bottom: 4px;
    }

    /* Adventure list */
    .ar-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 120px;
      overflow-y: auto;
    }

    .ar-adventure {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      background: #3A3D4D;
      border: 1px solid transparent;
      cursor: pointer;
      text-align: left;
      color: inherit;
      font: inherit;
    }

    .ar-adventure:hover { background: #44485a; }

    .ar-adventure.selected {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, .18);
    }

    .ar-adventure:disabled { cursor: default; opacity: .5; }

    .ar-adventure .ar-name { flex: 1; font-weight: 600; }
    .ar-adventure .ar-meta { font-size: .65rem; opacity: .6; }

    /* Controls */
    .ar-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .ar-mode {
      display: inline-flex;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #4b4f63;
    }

    .ar-mode button {
      padding: 4px 10px;
      background: transparent;
      color: inherit;
      border: 0;
      font: inherit;
      cursor: pointer;
      text-transform: capitalize;
    }

    .ar-mode button.active { background: #3b82f6; color: #fff; }
    .ar-mode button:disabled { cursor: default; }

    .ar-btn {
      padding: 5px 12px;
      border-radius: 4px;
      border: 0;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
    }

    .ar-btn:disabled { opacity: .4; cursor: default; }
    .ar-start { background: #10b981; margin-left: auto; }
    .ar-stop  { background: #ef4444; }
    .ar-here  { background: #3b82f6; }

    /* Loop options */
    .ar-options {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: .75rem;
    }

    .ar-option {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .ar-option input[type="number"] {
      width: 48px;
      padding: 2px 4px;
      border-radius: 3px;
      border: 1px solid #4b4f63;
      background: #2a2c38;
      color: inherit;
      font: inherit;
    }

    .ar-option select {
      padding: 2px 4px;
      border-radius: 3px;
      border: 1px solid #4b4f63;
      background: #2a2c38;
      color: inherit;
      font: inherit;
    }

    .ar-host {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ar-host input {
      flex: 1;
      min-width: 0;
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid #4b4f63;
      background: #2a2c38;
      color: inherit;
      font: inherit;
    }

    .ar-host input:focus { outline: none; border-color: #3b82f6; }

    .ar-hint { font-size: .65rem; opacity: .6; }

    .ar-counter {
      margin-left: auto;
      opacity: .7;
    }

    /* Steps */
    .ar-steps {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .ar-step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 4px;
      opacity: .55;
    }

    .ar-step i { width: 14px; text-align: center; }
    .ar-step.active { opacity: 1; font-weight: 600; }
    .ar-step.active i { color: #3b82f6; }
    .ar-step.done { opacity: .9; }
    .ar-step.done i { color: #10b981; }
    .ar-step.failed { opacity: 1; }
    .ar-step.failed i { color: #ef4444; }

    .ar-status {
      font-size: .75rem;
      padding: 4px 6px;
      border-radius: 4px;
      background: rgba(0, 0, 0, .2);
    }

    /* Log */
    .ar-log {
      flex: 1;
      min-height: 60px;
      overflow-y: auto;
      font-family: monospace;
      font-size: .65rem;
      background: rgba(0, 0, 0, .25);
      border-radius: 4px;
      padding: 4px 6px;
      word-break: break-all;
    }

    .ar-log .warn  { color: #f59e0b; }
    .ar-log .error { color: #ef4444; }
    .ar-log .ok    { color: #10b981; }
    .ar-log .send  { opacity: .6; }
  </style>
</head>
<body class="bg-primary-bg text-text-primary p-0 h-screen flex flex-col overflow-hidden">
  <div class="jam-plugin-header">
    <span class="jam-plugin-title">Adventures</span>
    <div class="jam-plugin-controls">
      <button class="jam-plugin-minimize" aria-label="Minimize"><i class="fas fa-minus"></i></button>
      <button class="jam-plugin-close" aria-label="Close"><i class="fas fa-times"></i></button>
    </div>
  </div>

  <div class="jam-plugin-content" style="flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
    <div class="ar-wrap">

      <div>
        <div class="ar-section-title">Adventure</div>
        <div id="adventureList" class="ar-list"></div>
      </div>

      <div>
        <div class="ar-section-title">Join</div>
        <div class="ar-host">
          <input id="hostName" type="text" placeholder="Host's username" autocomplete="off" spellcheck="false" aria-label="Username of the player hosting the adventure" maxlength="23">
        </div>
        <div class="ar-hint">They open the adventure from their den; you join, they press Start. Pick the same mode they chose.</div>
      </div>

      <div class="ar-controls">
        <div id="modeToggle" class="ar-mode"></div>
        <button id="startButton" class="ar-btn ar-start"><i class="fas fa-sign-in-alt"></i> Join</button>
        <button id="hereButton" class="ar-btn ar-here" title="Run the objectives in the adventure you're already in"><i class="fas fa-play"></i> Run here</button>
        <button id="stopButton" class="ar-btn ar-stop" disabled><i class="fas fa-stop"></i> Stop</button>
      </div>

      <div class="ar-options">
        <label class="ar-option">
          <input type="checkbox" id="loopToggle" checked> Loop
        </label>
        <label class="ar-option" title="0 = keep going until you press Stop">
          Runs <input type="number" id="loopRuns" min="0" value="0">
        </label>
        <label class="ar-option" title="Seconds to wait between runs">
          Wait <input type="number" id="loopDelay" min="0" value="5">s
        </label>
        <label class="ar-option">
          Prize
          <select id="prizeChoice">
            <option value="manual">I'll pick</option>
            <option value="1">Slot 1</option>
            <option value="2">Slot 2</option>
            <option value="3">Slot 3</option>
            <option value="4">Slot 4</option>
            <option value="5">Slot 5</option>
          </select>
        </label>
        <span id="runCounter" class="ar-counter"></span>
      </div>

      <div>
        <div class="ar-section-title">Objectives</div>
        <div id="stepList" class="ar-steps"></div>
      </div>

      <div id="status" class="ar-status">Pick an adventure, type the host's username and press Join.</div>

      <div id="log" class="ar-log"></div>
    </div>
  </div>

  <script src="app://assets/scripts/plugin-utils.js"></script>
  <script src="index.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function () { initializePluginUI(); });</script>
</body>
</html>
