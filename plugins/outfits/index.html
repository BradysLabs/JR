<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Outfits</title>
  <style>
    :root {
      --bg: #0b0b0c; --panel: #111113; --panel2: #151518; --line: #1f1f22; --line2: #2f2f34; --line3: #45454b;
      --text: #ededee; --dim: #a6a6ac; --faint: #6c6c72; --good: #4ade80; --warn: #fbbf24; --bad: #f87171;
      --mono: ui-monospace, "JetBrains Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }
    h1 { font-size: 16px; font-weight: 650; margin: 0; }
    h2 { font-size: 11px; font-weight: 600; margin: 0 0 8px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; }
    .sub { color: var(--faint); font-size: 12px; margin-top: 3px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .sp { flex: 1; }
    input { background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 9px; font: inherit; height: 32px; padding: 0 10px; outline: none; }
    input:focus { border-color: #5a5a60; }
    button { height: 32px; padding: 0 13px; border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer; background: transparent; color: var(--text); border: 1px solid var(--line2); white-space: nowrap; }
    button:hover:not(:disabled) { border-color: var(--line3); }
    button.primary { background: #f4f4f5; color: #0b0b0c; border: 0; }
    button.danger { color: var(--bad); }
    button.ghost { border-color: transparent; color: var(--faint); font-weight: 500; padding: 0 8px; }
    button:disabled { opacity: .4; cursor: default; }
    .card { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 12px 14px; }
    .now .items, .outfit .items { color: var(--dim); font-size: 12px; margin-top: 4px; line-height: 1.5; }
    .outfit + .outfit { margin-top: 10px; }
    .outfit .title { font-weight: 650; }
    .outfit .meta { color: var(--faint); font-size: 11.5px; }
    .empty { color: var(--faint); padding: 18px; text-align: center; font-size: 12.5px; border: 1px dashed var(--line2); border-radius: 12px; }
    #status { font-size: 12px; color: var(--faint); min-height: 18px; }
    #status.error { color: var(--bad); }
    #status.ok { color: var(--good); }
  </style>
</head>
<body>
  <div>
    <h1>Outfits</h1>
    <div class="sub">Save the clothes you're wearing and put them back on in one click. Outfits work on whichever animal you're playing as. Eyes, patterns and colors aren't included; change those in the game's animal editor.</div>
  </div>

  <div class="card now">
    <h2>Wearing now</h2>
    <div class="items" id="now"></div>
    <div class="row" style="margin-top:10px">
      <input id="name" maxlength="40" placeholder="Name this outfit" style="flex:1; min-width:160px">
      <button id="save" class="primary">Save outfit</button>
    </div>
  </div>

  <section>
    <h2>Saved outfits</h2>
    <div id="outfits"></div>
  </section>
  <div id="status"></div>

  <script>
    (async () => {
      const $ = (id) => document.getElementById(id)
      const escape = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
      const setStatus = (text, kind) => { $('status').textContent = text || ''; $('status').className = kind || '' }
      const jam = window.jam || await new Promise(resolve => {
        const t = setInterval(() => { if (window.jam) { clearInterval(t); resolve(window.jam) } }, 25)
      })
      const api = () => jam.dispatch.getState('shopTemplates')
      const store = jam.storage
      const items = jam.application && jam.application.items
      const clothingName = (c) => c.name && !/#\d+$/.test(c.name) ? c.name : ((items && items.getClothing && (items.getClothing(c.defId) || {}).name) || `Item #${c.defId}`)
      let outfits = store.get('outfits', [])
      if (!Array.isArray(outfits)) outfits = []
      let confirmDelete = null
      let lastKey = ''
      const save = () => store.set('outfits', outfits)

      function describe (o) {
        const parts = []
        parts.push(o.clothing.length ? o.clothing.map(clothingName).join(', ') : 'No clothing')
        return parts.join('')
      }

      function render (force) {
        const a = api()
        const now = a && a.currentOutfit ? a.currentOutfit() : null
        const key = JSON.stringify([now, outfits, confirmDelete])
        if (!force && key === lastKey) return
        lastKey = key
        if (a && !(a.version >= 2)) {
          // The background part still runs older code until JR fully restarts.
          $('now').innerHTML = '<span style="color:var(--bad)">JR is still running the old My Shop Restocker. Close JR completely (every JR window, including the profile picker) and open it again.</span>'
          $('save').disabled = true
          return
        }
        if (!a) {
          $('now').textContent = 'Turn on My Shop Restocker in Plugins. It’s what keeps track of your clothes.'
        } else if (!now.ready) {
          $('now').textContent = 'Log in to Animal Jam and JR will show what you’re wearing.'
        } else {
          $('now').textContent = describe(now)
        }
        $('save').disabled = !now || !now.ready

        const box = $('outfits')
        if (!outfits.length) { box.innerHTML = '<div class="empty">No outfits yet. Put something on in Animal Jam, name it above, and press Save outfit.</div>'; return }
        box.innerHTML = outfits.map((o, i) => {
          return `<div class="card outfit" data-i="${i}">
            <div class="row"><div><div class="title">${escape(o.name)}</div><div class="meta">${o.clothing.length} item${o.clothing.length === 1 ? '' : 's'}</div></div>
              <span class="sp"></span>
              <button class="primary" data-act="wear">Wear</button>
              <button class="danger" data-act="delete">${confirmDelete === i ? 'Press again' : 'Delete'}</button>
            </div>
            <div class="items">${escape(describe(o))}</div>
          </div>`
        }).join('')
      }

      $('save').onclick = () => {
        const a = api()
        if (!a) return
        const now = a.currentOutfit()
        const name = $('name').value.trim() || `Outfit ${outfits.length + 1}`
        outfits.push({
          id: Date.now().toString(36),
          name: name.slice(0, 40),
          clothing: now.clothing.map(c => ({ slot: c.slot, defId: c.defId, color: c.color, name: clothingName(c) })),
          savedAt: new Date().toISOString()
        })
        save()
        $('name').value = ''
        setStatus(`Saved “${name}”.`, 'ok')
        render(true)
      }
      $('name').onkeydown = (e) => { if (e.key === 'Enter') $('save').click() }

      $('outfits').addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-act]')
        if (!btn) return
        const i = Number(btn.closest('[data-i]').dataset.i)
        const o = outfits[i]
        const act = btn.dataset.act
        if (act !== 'delete') confirmDelete = null
        if (act === 'delete') {
          if (confirmDelete !== i) { confirmDelete = i; return render(true) }
          confirmDelete = null; outfits.splice(i, 1); save(); return render(true)
        }
        const a = api()
        if (!a) return setStatus('Turn on My Shop Restocker in Plugins first.', 'error')
        try {
          setStatus('Changing\u2026')
          const r = await a.wearOutfit(o, { clothing: true, look: false })
          const changed = r.putOn + r.tookOff
          const bits = [`${o.name}: ${changed ? 'done' : 'you\u2019re already wearing it'}.`]
          if (r.missing.length) bits.push(`Not in your inventory any more: ${r.missing.join(', ')}.`)
          if (r.notOn && r.notOn.length) bits.push(`The game didn\u2019t put on: ${r.notOn.join(', ')}.`)
          setStatus(bits.join(' '), r.missing.length || (r.notOn && r.notOn.length) ? 'error' : 'ok')
        } catch (error) { setStatus(error.message, 'error') }
        render(true)
      })

      render(true)
      setInterval(() => render(false), 1000)
    })().catch((error) => {
      const status = document.getElementById('status')
      status.textContent = "Outfits couldn't start: " + error.message
      status.className = 'error'
    })
  </script>
</body>
</html>
