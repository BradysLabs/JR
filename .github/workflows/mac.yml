# Builds JR for Mac on GitHub's Mac machines (BradysLabs).
#
# Runs by itself when a release is published, and attaches the Mac downloads
# to that release. Can also be run by hand from the Actions tab for a tag
# that already has a release.

name: Mac build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (like v0.1.1)
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # GitHub's Macs run XProtect, which keeps disk images busy and makes
      # building the .dmg fail ("hdiutil detach ... failed").
      - name: Stop XProtect
        run: |
          sudo pkill -9 XProtect >/dev/null || true
          while pgrep XProtect; do sleep 3; done

      # One at a time: both disk images are named "JR <version>", so building
      # them together makes them get in each other's way.
      - name: Build for Apple Silicon
        run: npx electron-builder build --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build for Intel
        run: npx electron-builder build --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Keep a copy on this run
        uses: actions/upload-artifact@v5
        with:
          name: JR-mac
          path: dist/*.dmg

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.dmg --clobber
